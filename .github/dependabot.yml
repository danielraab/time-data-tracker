# Dependabot version updates. Security updates are enabled separately in the repo
# settings (Settings → Code security) and are not affected by `schedule` or `cooldown`.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "npm" # also handles pnpm (pnpm-lock.yaml)
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    # pnpm rejects lockfile entries younger than its minimumReleaseAge (1 day) in
    # `pnpm install --frozen-lockfile`. Waiting longer than that keeps PRs from
    # failing CI right after a release.
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Next.js and React move together.
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Everything else that isn't a major bump: one PR per week.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep types in line with the Node 22 runtime (Dockerfile, CI).
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Node runtime majors are a deliberate decision, not a routine bump.
      - dependency-name: "node"
        versions: [">=23"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: "chore(docker)"
