# TiDaTra production stack.
#
# Usage:
#   docker compose pull        # fetch the latest image for the pinned tag
#   docker compose up -d       # start in the background
#   docker compose logs -f     # tail logs
#
# Override the image tag (defaults to the major.minor channel produced by the
# release workflow) or the published port via a sibling .env file:
#
#   TIDATRA_TAG=1.1
#   TIDATRA_PORT=3000
#
services:
  app:
    image: ghcr.io/danielraab/time-data-tracker:${TIDATRA_TAG:-1.1}
    container_name: tidatra
    restart: unless-stopped
    ports:
      - "${TIDATRA_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: /app/data/tidatra.db
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?COUCHDB_PASSWORD is required}
      # SMTP (magic-link email) — leave blank to disable
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Analytics snippets — leave blank to disable
      ANALYTICS_HEAD_SNIPPET: ${ANALYTICS_HEAD_SNIPPET:-}
      ANALYTICS_BODY_SNIPPET: ${ANALYTICS_BODY_SNIPPET:-}
      # OAuth providers — leave blank to disable
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
    depends_on:
      couchdb:
        condition: service_healthy
    volumes:
      - tidatra-data:/app/data
    depends_on:
      couchdb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

  couchdb:
    image: couchdb:3
    container_name: tidatra-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?COUCHDB_PASSWORD is required}
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:5984/_up
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

networks:
  default:
    name: tidatra-network

volumes:
  tidatra-data:
  couchdb-data:
